{% extends "base.html" %}
{% block title %}Configurar administrador — {{ settings.store_name }}{% endblock %}
{% block content %}<section class="admin-auth"><div class="auth-brand">✦</div><div class="eyebrow">PRIMEIRO ACESSO</div><h1>Crie seu<br><em>administrador.</em></h1><p>Esta etapa aparece apenas enquanto não existir um administrador cadastrado.</p><form method="post"><label>Nome de usuário<input name="username" required minlength="3" autocomplete="username"></label><label>Senha (mínimo 10 caracteres)<input type="password" name="password" required minlength="10" autocomplete="new-password"></label><label>Confirme a senha<input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></label><button class="button button-primary full-width">Criar acesso seguro ↗</button></form><a class="text-link" href="{{ url_for('home') }}">← Voltar para a loja</a></section>{% endblock %}
